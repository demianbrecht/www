# Build the Astro site and deploy it to GitHub Pages.
#
# Runs on every push to main (and can be triggered by hand). GitHub Pages must
# be set to "GitHub Actions" as its source (Settings > Pages > Build and
# deployment > Source).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-flight run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        env:
          PUBLIC_KIT_FORM_UID: ${{ vars.KIT_FORM_UID }}
          PUBLIC_KIT_FORM_EMBED_URL: ${{ vars.KIT_FORM_EMBED_URL }}
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-subscribers:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send newly public posts through Kit
        run: node scripts/publish-kit-broadcasts.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SITE_URL: https://demianbrecht.com
