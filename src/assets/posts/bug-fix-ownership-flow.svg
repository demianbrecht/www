<svg xmlns="http://www.w3.org/2000/svg" width="800" height="910" viewBox="0 0 800 910" role="img" aria-labelledby="title description">
  <title id="title">Who owns each step of an automated bug fix</title>
  <desc id="description">A bug report reaches software, which clones the target repository and gives an isolated workspace, with no credentials and no network, its scope and budget. An agent investigates and fixes the bug, exchanging evidence, test requests and results with the workspace. The agent's candidate patch goes to software static analysis; findings return to the agent while budget remains. Once checks pass, the agent explores in runtime QA and a human decides. After sign-off, software pushes a PR. In review, the agent proposes and a human reviews; revisions re-run the checks. With an approval bound to the commit, a human decides to merge and software executes it.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#7a8899"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; text-anchor: middle; }
    .title { fill: #e6e9ee; font-size: 18px; font-weight: 600; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.4px; }
    .note { fill: #a3abb8; font-size: 14px; }
    .edge { fill: #a3abb8; font-size: 15px; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .node { fill: #21262e; stroke: #3a424d; stroke-width: 1.5; }
    .software { fill: #1b2938; stroke: #4a9eff; stroke-width: 1.7; }
    .agent { fill: #282219; stroke: #d9a038; stroke-width: 1.7; }
    .human { fill: #1a271f; stroke: #4fb477; stroke-width: 1.7; }
    .software-tag { fill: #7cbaff; }
    .agent-tag { fill: #e6b65f; }
    .human-tag { fill: #7fd19f; }
    .flow { fill: none; stroke: #7a8899; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>

  <rect width="800" height="910" rx="12" fill="#14171c"/>

  <!-- Intake -->
  <rect x="40" y="30" width="270" height="52" rx="10" class="node"/>
  <text x="175" y="62" class="title">Bug report</text>

  <path d="M175 82V118" class="flow"/>

  <rect x="40" y="120" width="270" height="68" rx="10" class="software"/>
  <text x="175" y="150" class="title">Clone target repo</text>
  <text x="175" y="172" class="tag software-tag">SOFTWARE</text>

  <path d="M310 154H607Q625 154 625 172V240" class="flow"/>
  <text x="467" y="143" class="edge">Scope and budget</text>

  <path d="M175 188V246" class="flow"/>

  <!-- Investigation loop -->
  <rect x="40" y="248" width="270" height="68" rx="10" class="agent"/>
  <text x="175" y="278" class="title">Investigate and fix</text>
  <text x="175" y="300" class="tag agent-tag">AGENT</text>

  <rect x="490" y="242" width="270" height="80" rx="10" class="node"/>
  <text x="625" y="276" class="title">Isolated workspace</text>
  <text x="625" y="302" class="note">No credentials · no network</text>

  <path d="M310 268H488" class="flow"/>
  <text x="400" y="238" class="edge">Evidence and</text>
  <text x="400" y="256" class="edge">test requests</text>

  <path d="M490 296H312" class="flow"/>
  <text x="400" y="320" class="edge">Results</text>

  <!-- Checks -->
  <path d="M145 316V414" class="flow"/>
  <text x="133" y="360" class="edge end">Candidate</text>
  <text x="133" y="379" class="edge end">patch</text>

  <path d="M205 416V318" class="flow"/>
  <text x="217" y="360" class="edge start">Findings,</text>
  <text x="217" y="379" class="edge start">budget remains</text>

  <rect x="40" y="416" width="270" height="68" rx="10" class="software"/>
  <text x="175" y="446" class="title">Static analysis</text>
  <text x="175" y="468" class="tag software-tag">SOFTWARE</text>

  <path d="M310 450H488" class="flow"/>
  <text x="400" y="438" class="edge">Checks passed</text>

  <rect x="490" y="406" width="270" height="88" rx="10" class="agent"/>
  <text x="625" y="437" class="title">Runtime QA</text>
  <text x="625" y="461" class="tag agent-tag">AGENT EXPLORES</text>
  <text x="625" y="479" class="tag human-tag">HUMAN DECIDES</text>

  <!-- Review and merge -->
  <path d="M625 494V538" class="flow"/>
  <text x="611" y="521" class="edge end">Signed off</text>

  <rect x="490" y="540" width="270" height="68" rx="10" class="software"/>
  <text x="625" y="570" class="title">Push PR</text>
  <text x="625" y="592" class="tag software-tag">SOFTWARE</text>

  <path d="M625 608V652" class="flow"/>

  <rect x="490" y="654" width="270" height="88" rx="10" class="agent"/>
  <text x="625" y="685" class="title">Review and iterate</text>
  <text x="625" y="709" class="tag agent-tag">AGENT PROPOSES</text>
  <text x="625" y="727" class="tag human-tag">HUMAN REVIEWS</text>

  <path d="M490 698H193Q175 698 175 680V486" class="flow"/>
  <text x="332" y="688" class="edge">Revisions re-run the checks</text>

  <path d="M625 742V790" class="flow"/>
  <text x="611" y="771" class="edge end">Approval bound to this commit</text>

  <rect x="490" y="792" width="270" height="88" rx="10" class="human"/>
  <text x="625" y="823" class="title">Merge</text>
  <text x="625" y="847" class="tag human-tag">HUMAN DECIDES</text>
  <text x="625" y="865" class="tag software-tag">SOFTWARE EXECUTES</text>
</svg>
